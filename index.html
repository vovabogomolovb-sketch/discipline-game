<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Дисциплина</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--glass:rgba(16,18,34,.72);--glass2:rgba(255,255,255,.06);--line:rgba(255,255,255,.09);--ink:#eef0f6;--mute:#9aa1b8;--y:#ffd23f;--ok:#7be38a;--bad:#ff6b81;--gem:#73eff7;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#05060d;color:var(--ink);font:15px/1.4 Inter,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
#stage{position:fixed;inset:0}
#cv,#vx{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv{image-rendering:pixelated;image-rendering:crisp-edges}
#spots{position:absolute;inset:0;pointer-events:none}
.spot{position:absolute;pointer-events:auto;background:transparent;border:0;cursor:pointer;padding:0;border-radius:6px}
.spot span{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);white-space:nowrap;font:600 11px Inter,sans-serif;color:#15131f;background:var(--y);border-radius:999px;padding:4px 9px;box-shadow:0 4px 14px #0007;opacity:.92;transition:transform .15s}
.spot:hover span,.spot:focus-visible span{transform:translate(-50%,calc(-100% - 3px));opacity:1}
.spot:focus-visible{outline:2px solid var(--y)}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .28s}
#fade.on{opacity:1}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:20px;-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 10px 40px #0008}
#info{position:fixed;left:12px;top:max(12px,env(safe-area-inset-top,0px));width:min(380px,calc(100% - 24px));padding:16px 18px 14px;z-index:5}
#info h1{margin:0;font:800 26px/1.1 Inter,sans-serif;letter-spacing:-.02em}
#sub{color:var(--mute);margin-top:4px;font-size:15px}
#clock{color:var(--y);margin-top:2px;font-size:14px}
.ibtns{position:absolute;right:12px;top:12px;display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:12px;border:0;background:var(--glass2);color:var(--y);display:grid;place-items:center;cursor:pointer}
.ib svg{width:18px;height:18px;fill:currentColor}
.ib.off{color:var(--mute)}
#info hr{border:0;border-top:1px solid var(--line);margin:12px 0 10px}
#info.compact{padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:auto;max-width:calc(100% - 24px)}
#info.compact h1{font-size:18px}#info.compact #sub,#info.compact #clock,#info.compact hr{display:none}
#info.compact .ibtns{position:static;order:3}#info.compact .stats{order:2}
.stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:flex;align-items:center;gap:6px;font:600 13px 'JetBrains Mono',monospace;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--glass2)}
.pill i{width:8px;height:8px;border-radius:2px;display:inline-block}
.pill.c b{color:var(--y)}.pill.g b{color:var(--gem)}.pill.f b{color:#ff9d5c}
.pill small{color:var(--mute);font:500 12px Inter,sans-serif}
.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.15)}}
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom,0px));width:min(760px,calc(100% - 20px));z-index:5;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--ink);font:600 14px Inter,sans-serif;cursor:pointer}
.chip svg{width:16px;height:16px;fill:currentColor;opacity:.9}
.chip.on{border-color:var(--y);color:var(--y);box-shadow:inset 0 0 0 1px var(--y)}
.chip.sep{width:1px;padding:0;border:0;background:var(--line);margin:6px 2px}
#today{padding:12px 14px 14px}
.th{display:flex;align-items:center;gap:10px}
.play{width:44px;height:44px;flex:none;border-radius:13px;border:0;background:var(--y);color:#15131f;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 4px #ffd23f22}
.play svg{width:20px;height:20px;fill:currentColor}
.tt{flex:1;min-width:0}
.tt b{display:block;font-size:16px}
.tt small{color:var(--mute);font-family:'JetBrains Mono',monospace;font-size:12px}
.bar{height:6px;border-radius:999px;background:#ffffff14;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--y);border-radius:999px;transition:width .4s}
.hl{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
@media (min-width:520px){.hl{grid-template-columns:1fr 1fr 1fr}}
@media (max-width:600px){#info{padding:12px 14px 10px}#info h1{font-size:21px}#sub{font-size:13px}#clock{font-size:12px}#info hr{margin:8px 0 7px}.ib{width:34px;height:34px}.pill{padding:3px 8px;font-size:12px}.chip{padding:8px 12px;font-size:13px}.hb{min-height:42px;padding:7px 9px;font-size:13px}.play{width:40px;height:40px}#today{padding:10px 12px 12px}}
.hb{display:flex;align-items:center;gap:9px;text-align:left;padding:9px 10px;min-height:48px;border-radius:13px;border:1px solid var(--line);background:var(--glass2);color:var(--ink);font:500 14px/1.2 Inter,sans-serif;cursor:pointer}
.hb .ck{width:22px;height:22px;flex:none;border-radius:7px;border:2px solid #ffffff38;display:grid;place-items:center}
.hb .ck svg{width:14px;height:14px;fill:#10131c;display:none}
.hb.on{background:#7be38a1f;border-color:#7be38a66}
.hb.on .ck{background:var(--ok);border-color:var(--ok)}.hb.on .ck svg{display:block}
.hb .hn{flex:1;min-width:0}
.hb small{display:block;color:var(--mute);font:500 11px 'JetBrains Mono',monospace;margin-top:2px}
.hb.goal small{color:var(--ok)}
.abs{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.abs .grow{flex:1;min-width:0}
.abs b{font:800 20px Inter,sans-serif;color:#ff9d5c}
.abs small{display:block;color:var(--mute);font-size:12px}
.b{font:600 14px Inter,sans-serif;border-radius:12px;border:0;padding:10px 14px;background:var(--y);color:#15131f;cursor:pointer;min-height:42px}
.b:disabled{opacity:.45;cursor:not-allowed}
.b.g{background:var(--glass2);color:var(--ink);border:1px solid var(--line)}
.b.r{background:#ff6b8133;color:#ffb3c0;border:1px solid #ff6b8166}
.b.ok{background:var(--ok)}
.b.sm{font-size:13px;padding:8px 11px;min-height:36px}
.b:focus-visible,.hb:focus-visible,.chip:focus-visible,.ib:focus-visible,.cell:focus-visible{outline:2px solid #fff;outline-offset:2px}
#today.fold .hl,#today.fold .abs{display:none}
#dlg{position:fixed;inset:0;z-index:40;background:#03040acc;display:none;align-items:flex-start;justify-content:center;padding:max(14px,env(safe-area-inset-top,0px)) 10px 14px;overflow-y:auto}
#dlg.on{display:flex}
#dlg>.glass{width:100%;max-width:620px;margin:auto 0;padding:20px 18px 18px;position:relative;animation:pop .2s}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
#dlg h2{margin:0 0 6px;font:800 22px Inter,sans-serif;padding-right:44px}
#dlg h3{margin:18px 0 8px;font:600 12px 'JetBrains Mono',monospace;color:var(--y);text-transform:uppercase;letter-spacing:.06em}
#dx{position:absolute;right:12px;top:12px}
.mute{color:var(--mute);font-size:14px}
.it{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.it .nm{flex:1;min-width:0}
.it .pr{font:600 13px 'JetBrains Mono',monospace;color:var(--y);white-space:nowrap}
.it .pr.gem{color:var(--gem)}
.it img{width:132px;flex:none;border-radius:10px;background:#ffffff08}
@media (max-width:420px){.it img{width:96px}}
table{border-collapse:collapse;width:100%}
.wrap{overflow-x:auto}
th,td{padding:3px;text-align:center;font-weight:400}
th{font:600 11px 'JetBrains Mono',monospace;color:var(--mute)}
th.t{color:var(--y)}
td.n{text-align:left;min-width:100px;font-size:14px}
.cell{width:32px;height:32px;padding:0;border-radius:9px;border:1px solid var(--line);background:var(--glass2);color:#10131c;cursor:pointer;display:grid;place-items:center}
.cell svg{width:14px;height:14px;fill:currentColor}
.cell.on{background:var(--ok);border-color:var(--ok)}
.cell.t{box-shadow:inset 0 0 0 2px var(--y)}
td.gl{font:600 12px 'JetBrains Mono',monospace;color:var(--mute);white-space:nowrap}
td.gl.ok{color:var(--ok)}
.ed{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.ed input{font:inherit;padding:9px 10px;background:#ffffff0d;color:var(--ink);border:1px solid var(--line);border-radius:10px;min-width:0}
.ed input.n{flex:1 1 160px}.ed input.s{width:72px}
.ed select{font:inherit;font-size:13px;padding:9px 8px;background:#ffffff0d;color:var(--ink);border:1px solid var(--line);border-radius:10px;max-width:100%}
label.l{display:block;color:var(--mute);font-size:13px;margin-bottom:4px}
textarea{width:100%;font:12px 'JetBrains Mono',monospace;background:#ffffff0d;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px}
.log{list-style:none;margin:0;padding:0;font-size:14px;color:var(--mute)}
.log li{padding:3px 0}.log b{color:var(--y);font-family:'JetBrains Mono',monospace}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);z-index:60;max-width:92%;background:var(--y);color:#15131f;border-radius:14px;padding:11px 16px;font:600 14px Inter,sans-serif;text-align:center;transition:transform .3s;pointer-events:none;box-shadow:0 8px 30px #0008}
#toast.on{transform:translate(-50%,0)}
.fly{position:fixed;z-index:70;width:12px;height:12px;border-radius:3px;pointer-events:none;transition:transform .6s cubic-bezier(.5,-.3,.6,1),opacity .6s}
@media (prefers-reduced-motion:reduce){.fly,#fade,#toast,.spot span{transition:none}#dlg>.glass,.bump{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" aria-label="Улица"></canvas>
  <canvas id="vx" aria-label="Сцена" hidden></canvas>
  <div id="spots"></div>
  <div id="fade"></div>
</div>
<header class="glass" id="info">
  <h1 id="ttl">Моя улица</h1>
  <div id="sub"></div>
  <div class="mono" id="clock"></div>
  <div class="ibtns">
    <button class="ib" id="snd" aria-label="Звук"><svg viewBox="0 0 16 16"><path d="M2 6h3l4-3v10l-4-3H2zM11 5h1v6h-1zM13 3h1v10h-1z"/></svg></button>
    <button class="ib" id="menu" aria-label="Меню"><svg viewBox="0 0 16 16"><path d="M2 3h12v2H2zM2 7h12v2H2zM2 11h12v2H2z"/></svg></button>
  </div>
  <hr>
  <div class="stats">
    <span class="pill c" id="pBal" title="Баллы"><i style="background:var(--y)"></i><b id="vBal">0</b><small>баллы</small></span>
    <span class="pill f" id="pSt" title="Дней без срыва"><i style="background:#ff9d5c"></i><b id="vSt">0</b><small>дн.</small></span>
  </div>
</header>
<div id="dock">
  <div class="chips" id="chips"></div>
  <section class="glass" id="today"></section>
</div>
<div id="dlg" role="dialog" aria-modal="true"><div class="glass"><button class="ib" id="dx" aria-label="Закрыть"><svg viewBox="0 0 16 16"><path d="M3 4l1-1 4 4 4-4 1 1-4 4 4 4-1 1-4-4-4 4-1-1 4-4z"/></svg></button><div id="dc"></div></div></div>
<div id="toast" role="status"></div>
<script src="js/pixel.js"></script>
<script src="js/state.js"></script>
<script src="js/audio.js"></script>
<script src="js/voxel.js"></script>
<script src="js/cars.js"></script>
<script src="js/hero.js"></script>
<script src="js/room.js"></script>
<script src="js/garage.js"></script>
<script src="js/life.js"></script>
<script src="js/street.js"></script>
<script src="js/ui.js"></script>
</body>
</html>

</body></html>
